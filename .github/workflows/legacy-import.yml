name: legacy-import

# One-shot importer (D-1): decodes the checksummed v1.0.0 DOCX and PDF payloads
# committed under .legacy-import/ and writes byte-exact binaries to legacy/.
# The text-only maintainer tooling cannot push arbitrary binary bytes, so this
# workflow performs the transfer. GitHub rejects pushes by the Actions GITHUB_
# TOKEN that modify workflow files, so this workflow deliberately commits ONLY
# legacy/; removal of the payloads and of this workflow afterwards is done by
# the maintainer with the regular text tooling.

on:
  push:
    branches: ['**']
    paths:
      - '.legacy-import/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode payloads and verify checksums
        run: |
          python3 - << 'PY'
          import base64, hashlib, pathlib
          DOCX_MD5 = "4e2ecd0a118e96ba246dfa4c79665a9e"
          PDF_MD5 = "589e5ecf7361b8a392a1573d73f080d9"
          def decode(src, dst, expected):
              b = base64.b64decode(pathlib.Path(src).read_text(encoding="utf-8"))
              got = hashlib.md5(b).hexdigest()
              assert got == expected, f"checksum mismatch for {src}: {got}"
              pathlib.Path(dst).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(dst).write_bytes(b)
              print(f"ok {dst}: {len(b)} bytes, md5 {got}")
          decode(".legacy-import/OpenScience_Glossary.docx.b64", "legacy/OpenScience_Glossary.docx", DOCX_MD5)
          decode(".legacy-import/OpenScience_Glossary.pdf.b64", "legacy/OpenScience_Glossary.pdf", PDF_MD5)
          PY
      - name: Commit legacy/ binaries only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/
          git diff --staged --quiet || git commit -m "legacy: record the v1.0.0 DOCX and PDF export (D-1, byte-exact import verified by checksum)"
          git push

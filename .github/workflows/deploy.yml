name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUGO_VERSION: "0.170.0"
  HUGO_SHA256: "0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        run: |
          python3 scripts/validate.py content/terms
          python3 scripts/export_bib.py content/terms static/downloads/open-science-glossary.bib
          if [ -f legacy/OpenScience_Glossary.docx ]; then
            python3 scripts/check_migration.py legacy/OpenScience_Glossary.docx content/terms
          fi
      - name: Install pinned Hugo
        run: |
          curl -sL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo
      - name: Build site
        run: hugo --minify --printPathWarnings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Codeberg mirror (ADR-0008): add a job that pushes the built repo to
# codeberg.org/os-glossary once a CODEBERG_TOKEN secret is set (Phase 4).

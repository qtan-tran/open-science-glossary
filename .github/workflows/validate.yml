name: validate

on:
  push:
  pull_request:

env:
  HUGO_VERSION: "0.170.0"
  HUGO_SHA256: "0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0"

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JSON schemas parse
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("schemas").glob("*.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          PY
      - name: Check vocabularies are well formed
        run: |
          python3 - << 'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from validate import id_list
          themes = id_list(Path("data/themes.yaml"))
          rels = id_list(Path("data/relationship-types.yaml"))
          assert themes and len(themes) >= 8, themes
          assert rels and len(rels) >= 8, rels
          print("ok vocabularies:", len(themes), "themes,", len(rels), "relation types")
          PY

  validate-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint term files
        run: |
          if ! ls content/terms/*.md >/dev/null 2>&1; then
            echo "content/terms not created yet; skipping"
            exit 0
          fi
          python3 scripts/validate.py content/terms
      - name: BibTeX export smoke test (ROADMAP 1.3)
        run: |
          python3 scripts/export_bib.py content/terms static/downloads/open-science-glossary.bib

  migration-acceptance:
    runs-on: ubuntu-latest
    # Word-for-word gate against the legacy DOCX (D-11); runs once legacy/ exists.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check migration acceptance
        run: |
          if [ ! -f legacy/OpenScience_Glossary.docx ]; then
            echo "legacy DOCX not committed yet; skipping (D-1)"
            exit 0
          fi
          if ! ls content/terms/*.md >/dev/null 2>&1; then
            echo "no term files yet; skipping"
            exit 0
          fi
          python3 scripts/check_migration.py legacy/OpenScience_Glossary.docx content/terms

  build:
    runs-on: ubuntu-latest
    # Site must build with the pinned Hugo before anything deploys (D-2).
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Hugo
        run: |
          curl -sL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          tar -xzf hugo.tar.gz hugo
          sudo install hugo /usr/local/bin/hugo
      - name: Build site
        run: hugo --minify --printPathWarnings
